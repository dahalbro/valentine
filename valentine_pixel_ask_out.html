<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Go Out With Me? 💗</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, #ffd9e6 0 3px, transparent 4px),
      radial-gradient(circle at 80% 70%, #ffd9e6 0 3px, transparent 4px),
      #fff0f5;
    font-family: "Courier New", monospace;
    image-rendering: pixelated;
    color: #5b2037;
  }

  .screen {
    width: min(92vw, 720px);
    min-height: 500px;
    position: relative;
    padding: 46px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #fff8fb;
    border: 8px solid #5b2037;
    box-shadow: 12px 12px 0 #d85b7a;
  }

  .hearts { font-size: 30px; letter-spacing: 12px; margin-bottom: 12px; }
  .pixel-heart { display: inline-block; animation: float 1.7s ease-in-out infinite; }
  .pixel-heart:nth-child(2) { animation-delay: .25s; }
  .pixel-heart:nth-child(3) { animation-delay: .5s; }

  h1 {
    margin: 8px 0 14px;
    font-size: clamp(28px, 6vw, 52px);
    line-height: 1.05;
    text-shadow: 4px 4px 0 #ffc1d3;
  }

  .question {
    font-size: clamp(17px, 3vw, 23px);
    margin: 0 0 34px;
  }

  .buttons {
    width: min(460px, 90%);
    height: 130px;
    position: relative;
  }

  button {
    border: 5px solid #5b2037;
    padding: 14px 28px;
    font: bold 20px "Courier New", monospace;
    cursor: pointer;
    box-shadow: 6px 6px 0 #5b2037;
    transition: transform .08s;
  }
  button:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #5b2037; }

  #yes {
    background: #ff7fa3;
    color: white;
    position: absolute;
    left: 18%;
    top: 20px;
  }

  #no {
    background: #eee;
    color: #5b2037;
    position: absolute;
    left: 58%;
    top: 20px;
    transition: left .12s, top .12s;
  }

  .hint {
    margin-top: 20px;
    font-size: 13px;
    opacity: .7;
  }

  .success { display: none; }
  .success h2 {
    font-size: clamp(30px, 7vw, 58px);
    margin: 15px 0;
  }
  .success p { font-size: 19px; line-height: 1.6; }

  .big-heart {
    font-size: 90px;
    animation: beat .7s infinite alternate;
  }

  .sparkles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-size: 24px;
  }
  .sparkles span {
    position: absolute;
    animation: rise 4s linear infinite;
    opacity: 0;
  }
  .sparkles span:nth-child(1){left:8%;animation-delay:.2s}
  .sparkles span:nth-child(2){left:22%;animation-delay:1.4s}
  .sparkles span:nth-child(3){left:48%;animation-delay:.7s}
  .sparkles span:nth-child(4){left:72%;animation-delay:2s}
  .sparkles span:nth-child(5){left:90%;animation-delay:1s}

  @keyframes float { 50% { transform: translateY(-8px); } }
  @keyframes beat { to { transform: scale(1.15); } }
  @keyframes rise {
    0% { bottom: -30px; opacity: 0; transform: translateX(0); }
    20% { opacity: 1; }
    100% { bottom: 110%; opacity: 0; transform: translateX(30px); }
  }

  @media (max-width: 520px) {
    .screen { min-height: 540px; }
    #yes { left: 8%; }
    #no { left: 56%; }
  }
</style>
</head>
<body>
<div class="sparkles">
  <span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span>
</div>

<main class="screen" id="questionScreen">
  <div class="hearts">
    <span class="pixel-heart">♥</span>
    <span class="pixel-heart">♥</span>
    <span class="pixel-heart">♥</span>
  </div>

  <h1>Will you go out with me?</h1>
  <p class="question">♡ Be my Valentine? ♡</p>

  <div class="buttons" id="buttonArea">
    <button id="yes">YES! ♡</button>
    <button id="no">NO :(</button>
  </div>

  <div class="hint">choose carefully hehe...</div>
</main>

<main class="screen success" id="successScreen">
  <div class="big-heart">♥</div>
  <h2>YAYYYYY!!</h2>
  <p>
    I KNEW YOU'D SAY YES ♡<br>
    Happy Valentine's Day, silly!!
  </p>
  <div class="hearts">♥ ♡ ♥</div>
</main>

<script>
  const no = document.getElementById("no");
  const area = document.getElementById("buttonArea");
  const yes = document.getElementById("yes");
  const questionScreen = document.getElementById("questionScreen");
  const successScreen = document.getElementById("successScreen");

  function dodge() {
    const areaRect = area.getBoundingClientRect();
    const btnRect = no.getBoundingClientRect();

    const maxX = area.clientWidth - btnRect.width;
    const maxY = area.clientHeight - btnRect.height;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    // Keep it from accidentally landing on top of YES.
    const yesRect = yes.getBoundingClientRect();
    for (let i = 0; i < 12; i++) {
      const test = { left: areaRect.left + x, top: areaRect.top + y };
      const overlap =
        test.left < yesRect.right &&
        test.left + btnRect.width > yesRect.left &&
        test.top < yesRect.bottom &&
        test.top + btnRect.height > yesRect.top;
      if (!overlap) break;
      x = Math.random() * maxX;
      y = Math.random() * maxY;
    }

    no.style.left = x + "px";
    no.style.top = y + "px";
  }

  no.addEventListener("mouseenter", dodge);
  no.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dodge();
  });
  no.addEventListener("click", (e) => {
    e.preventDefault();
    dodge();
  });

  yes.addEventListener("click", () => {
    questionScreen.style.display = "none";
    successScreen.style.display = "flex";
  });
</script>
</body>
</html>
